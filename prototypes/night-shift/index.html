<script>
'use strict';
// Night Shift: guard a stolen classic car in a back-alley garage until dawn, in first person,
// with your fists, feet and a tyre iron. Everything is drawn in code as a pencil sketch.

// ---- Built to be checked ----------------------------------------------------------------
const params = new URLSearchParams(location.search);
const tune = new Proxy({}, { get: (_, k) => CONFIG[k].value }); // live: tune.speed is CONFIG.speed.value
const STEP = 1 / 60;            // simulation step in seconds; motion is per second, never per frame
const W = 1280, H = 720;        // logical size
const PIXEL = false;
const FONT = "'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS','Comic Neue',cursive";
const TITLE = 'Night Shift';
const CONTROLS = [
  'J  jab      K  cross      L  kick     (mouse: left jab, right cross)',
  'SPACE  hold to guard, tap just as a blow lands to PARRY',
  'A / D  slip left / right       S  turn round to face the car',
  'E  grab the tyre iron (at the workbench)      ESC  pause + move list      M  mute',
];
const clock = window.GAME_CLOCK || { now: () => performance.now() / 1000 }; // a check may inject one
const CHEAP = params.get('render') === 'cheap';
let seed;
function rng() { // mulberry32; every gameplay random call reads this, never Math.random
  seed = (seed + 0x6D2B79F5) | 0;
  let t = Math.imul(seed ^ (seed >>> 15), seed | 1);
  t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
const events = [];

// ---- Screen ---------------------------------------------------------------------------
const canvas = document.getElementById('game');
const CTX_OPTS = CHEAP ? { willReadFrequently: true } : {}; // a check's software browser draws faster on the CPU
const mainCtx = canvas.getContext('2d', CTX_OPTS);
let ctx = mainCtx; // swapped to an offscreen context while the backgrounds are prerendered
function fit() {
  const k = Math.min(innerWidth / W, innerHeight / H);
  const s = k;
  const r = s * (devicePixelRatio || 1);
  canvas.width = Math.round(W * r); canvas.height = Math.round(H * r);
  canvas.style.width = Math.round(W * s) + 'px'; canvas.style.height = Math.round(H * s) + 'px';
  canvas.style.marginTop = Math.max(0, Math.floor((innerHeight - H * s) / 2)) + 'px';
  mainCtx.setTransform(r, 0, 0, r, 0, 0); mainCtx.imageSmoothingEnabled = true;
}
addEventListener('resize', fit); fit();
function text(s, x, y, size, c, align = 'center') {
  ctx.fillStyle = c; ctx.font = `${size}px ${FONT}`; ctx.textAlign = align;
  ctx.textBaseline = 'middle'; ctx.fillText(s, x, y);
}

// ---- Pencil kit: visual only, never gameplay --------------------------------------------
const PAPER = '#ebe4d3', PAPER2 = '#e2dac6';
const RED = '#b3261e';
const ink = a => `rgba(36,32,30,${a})`;
const red = a => `rgba(179,38,30,${a})`;
let boil = 0, jc = 0, vt = 0; // boil: which redraw of the sketch (8 a second); vt: visual time
function vr() { // deterministic per boil frame and draw order, so lines wobble 8 times a second
  let x = (boil * 374761393 + (jc++) * 668265263 + 1013904223) | 0;
  x = Math.imul(x ^ (x >>> 13), 1274126177); x ^= x >>> 16;
  return (x >>> 0) / 4294967296;
}
const jit = a => (vr() - 0.5) * 2 * a;
const lerp = (a, b, t) => a + (b - a) * t;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const easeOut = t => 1 - (1 - t) * (1 - t);
const easeIn = t => t * t;

function sline(x1, y1, x2, y2, w = 1.6, a = 0.85, j = 1.4, col = ink) {
  ctx.lineCap = 'round';
  const ox = (x2 - x1) * 0.04, oy = (y2 - y1) * 0.04; // a pencil line overshoots its corners a hair
  for (let p = 0; p < 2; p++) {
    ctx.strokeStyle = col(p ? a * 0.45 : a); ctx.lineWidth = p ? w * 0.6 : w;
    ctx.beginPath();
    ctx.moveTo(x1 - ox * p + jit(j), y1 - oy * p + jit(j));
    ctx.quadraticCurveTo((x1 + x2) / 2 + jit(j * 1.6), (y1 + y2) / 2 + jit(j * 1.6), x2 + ox * p + jit(j), y2 + oy * p + jit(j));
    ctx.stroke();
  }
}
function spath(pts, close, w = 1.6, a = 0.85, j = 1.4, col = ink) {
  const n = pts.length;
  for (let i = 0; i < (close ? n : n - 1); i++) {
    const p = pts[i], q = pts[(i + 1) % n];
    sline(p[0], p[1], q[0], q[1], w, a, j, col);
  }
}
function ellipsePts(cx, cy, rx, ry, n = 14, rot = 0) {
  const pts = [];
  for (let i = 0; i < n; i++) {
    const a = rot + i / n * Math.PI * 2;
    pts.push([cx + Math.cos(a) * rx, cy + Math.sin(a) * ry]);
  }
  return pts;
}
function bbox(pts) {
  let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
  for (const [x, y] of pts) { x0 = Math.min(x0, x); y0 = Math.min(y0, y); x1 = Math.max(x1, x); y1 = Math.max(y1, y); }
  return [x0, y0, x1, y1];
}
// Parallel pencil strokes over a box at an angle; the caller clips.
function hatchBox(x0, y0, x1, y1, ang, gap, a, w = 1.1, col = ink, broken = false) {
  const cx = (x0 + x1) / 2, cy = (y0 + y1) / 2, R = Math.hypot(x1 - x0, y1 - y0) / 2 + 4;
  const dx = Math.cos(ang), dy = Math.sin(ang), nx = -dy, ny = dx;
  ctx.lineWidth = w; ctx.lineCap = 'round';
  for (let o = -R; o <= R; o += gap) {
    const g = gap * 0.25;
    const bx = cx + nx * (o + jit(g)), by = cy + ny * (o + jit(g));
    ctx.strokeStyle = col(a * (0.7 + vr() * 0.5));
    ctx.beginPath();
    if (broken) { // short strokes, the way a hand hatches a big area
      let s = -R + vr() * 30;
      while (s < R) {
        const len = 60 + vr() * 140;
        ctx.moveTo(bx + dx * s, by + dy * s); ctx.lineTo(bx + dx * Math.min(R, s + len) + jit(1), by + dy * Math.min(R, s + len) + jit(1));
        s += len + 4 + vr() * 12;
      }
    } else {
      ctx.moveTo(bx - dx * R + jit(2), by - dy * R + jit(2)); ctx.lineTo(bx + dx * R + jit(2), by + dy * R + jit(2));
    }
    ctx.stroke();
  }
}
function polyPath(pts) { ctx.beginPath(); pts.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)); ctx.closePath(); }
// A filled pencil shape: paper fill, hatched by tone (0 none .. 1 near black), sketched outline.
function shape(pts, tone, ang = 0.9, w = 1.6, fill = PAPER, cross = tone > 0.62) {
  polyPath(pts); ctx.fillStyle = fill; ctx.fill();
  if (tone > 0.02) {
    ctx.save(); polyPath(pts); ctx.clip();
    const [x0, y0, x1, y1] = bbox(pts);
    const gap = lerp(13, 3.2, tone);
    hatchBox(x0, y0, x1, y1, ang, gap, 0.55);
    if (cross) hatchBox(x0, y0, x1, y1, ang + 1.3, gap * 1.4, 0.45);
    ctx.restore();
  }
  spath(pts, true, w, 0.9, Math.max(0.8, w * 0.7));
}
function limb(a, b, wa, wb, tone, w = 1.6, ang = 0.9) {
  const dx = b.x - a.x, dy = b.y - a.y, L = Math.hypot(dx, dy) || 1, nx = -dy / L, ny = dx / L;
  const pts = [[a.x + nx * wa, a.y + ny * wa], [b.x + nx * wb, b.y + ny * wb], [b.x + dx / L * wb * 0.6, b.y + dy / L * wb * 0.6],
    [b.x - nx * wb, b.y - ny * wb], [a.x - nx * wa, a.y - ny * wa], [a.x - dx / L * wa * 0.5, a.y - dy / L * wa * 0.5]];
  shape(pts, tone, ang, w);
}
function scribble(x, y, r, n, col, a = 0.8, w = 2) { // a quick tight scrawl
  ctx.strokeStyle = col(a); ctx.lineWidth = w; ctx.beginPath();
  for (let i = 0; i <= n; i++) {
    const px = x + jit(r), py = y + jit(r * 0.7);
    i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
  }
  ctx.stroke();
}
function burst(x, y, r, col, n = 9, a = 0.9) { // impact: strokes flying out
  for (let i = 0; i < n; i++) {
    const ang = i / n * Math.PI * 2 + jit(0.25);
    const r0 = r * (0.35 + vr() * 0.2), r1 = r * (0.8 + vr() * 0.5);
    sline(x + Math.cos(ang) * r0, y + Math.sin(ang) * r0, x + Math.cos(ang) * r1, y + Math.sin(ang) * r1, 2.6, a, 1.5, col);
  }
}

// ---- Offscreen layers: paper and the two views, three redraws each for the line boil ----
function offscreen(fn, b) {
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const saved = ctx; ctx = c.getContext('2d', CTX_OPTS); boil = b; jc = 0;
  fn(); ctx = saved; return c;
}
function paperBase() {
  ctx.fillStyle = PAPER; ctx.fillRect(0, 0, W, H);
  for (let i = 0; i < 2600; i++) { // grain
    ctx.fillStyle = vr() < 0.5 ? 'rgba(120,105,80,0.06)' : 'rgba(255,255,255,0.12)';
    ctx.fillRect(vr() * W, vr() * H, 1 + vr() * 2, 1 + vr() * 2);
  }
  for (let i = 0; i < 70; i++) { // fibres
    const x = vr() * W, y = vr() * H;
    ctx.strokeStyle = 'rgba(110,95,70,0.07)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + jit(30), y + jit(30)); ctx.stroke();
  }
}
const VP = { x: 640, y: 300 };
function room(back) { // the garage box: ceiling, side walls, floor, back wall frame
  paperBase();
  // ceiling
  shape([[0, 0], [W, 0], [980, 120], [300, 120]], 0.78, -0.2, 1.4, PAPER2);
  for (let i = 1; i < 6; i++) { // roof beams
    const x = lerp(300, 980, i / 6);
    sline(x, 120, lerp(-200, 1480, i / 6), 0, 3, 0.7, 2);
  }
  // left wall, right wall
  shape([[0, 0], [300, 120], [300, 470], [0, 720]], 0.6, 1.2, 1.4, PAPER2);
  shape([[W, 0], [980, 120], [980, 470], [W, 720]], 0.6, -1.2, 1.4, PAPER2);
  // floor with perspective seams and oil stains
  shape([[0, 720], [300, 470], [980, 470], [W, 720]], 0.25, 0.05, 1.4);
  for (let i = 0; i <= 8; i++) sline(lerp(300, 980, i / 8), 470, lerp(-500, 1780, i / 8), 720, 1, 0.35, 2);
  for (const yy of [500, 545, 610, 700]) {
    const k = (yy - 470) / 250; sline(lerp(300, 0, k), yy, lerp(980, W, k), yy, 1, 0.3, 2);
  }
  for (const [x, y, rx, ry] of [[470, 560, 70, 14], [860, 640, 110, 20], [590, 690, 60, 10]]) {
    ctx.save(); polyPath(ellipsePts(x, y, rx, ry, 16)); ctx.clip(); hatchBox(x - rx, y - ry, x + rx, y + ry, 0.3, 3.5, 0.5); ctx.restore();
    spath(ellipsePts(x, y, rx, ry, 16), true, 1, 0.5, 2);
  }
  // drain grate
  shape([[600, 600], [690, 600], [700, 618], [592, 618]], 0.9, 0, 1.2);
  // a strip light, dead, on the beam
  shape([[560, 128], [720, 128], [712, 138], [568, 138]], 0.1, 0, 1.2);
}
function bricks(x0, y0, x1, y1, bw = 46, bh = 18, a = 0.45) {
  for (let y = y0, r = 0; y < y1; y += bh, r++) {
    sline(x0, y, x1, y, 1, a, 1.5);
    for (let x = x0 + (r % 2 ? bw / 2 : 0); x < x1; x += bw) sline(x, y, x, Math.min(y1, y + bh), 1, a, 1);
  }
}
function tyreStack(x, y, r, n) {
  for (let i = 0; i < n; i++) {
    const yy = y - i * r * 0.55;
    shape(ellipsePts(x, yy, r, r * 0.34, 18), 0.85, 0.3, 1.6, PAPER2);
    shape(ellipsePts(x, yy - 3, r * 0.5, r * 0.15, 14), 0.2, 0.3, 1.2);
    for (let k = 0; k < 7; k++) { const a = k / 7 * Math.PI; sline(x + Math.cos(a) * r * 0.75, yy + Math.sin(a) * r * 0.3, x + Math.cos(a) * r * 0.95, yy + Math.sin(a) * r * 0.33, 1, 0.4, 0.8); }
  }
}
function pegboard(x0, y0, x1, y1) {
  shape([[x0, y0], [x1, y0 - 40], [x1, y1 + 30], [x0, y1]], 0.35, 1.0, 1.4);
  const tools = [[x0 + 40, y0 + 40, 'spanner'], [x0 + 95, y0 + 30, 'hammer'], [x0 + 150, y0 + 22, 'spanner'], [x0 + 200, y0 + 18, 'saw']];
  for (const [x, y, t] of tools) {
    if (t === 'spanner') { shape([[x - 5, y], [x + 5, y], [x + 6, y + 80], [x - 6, y + 80]], 0.4, 0.5, 1.2); spath(ellipsePts(x, y - 4, 12, 9, 10), true, 1.3, 0.8, 1); spath(ellipsePts(x, y + 88, 11, 9, 10), true, 1.3, 0.8, 1); }
    if (t === 'hammer') { shape([[x - 4, y + 10], [x + 4, y + 10], [x + 5, y + 95], [x - 5, y + 95]], 0.2, 0.5, 1.2); shape([[x - 22, y], [x + 22, y], [x + 22, y + 16], [x - 22, y + 16]], 0.8, 0.5, 1.4); }
    if (t === 'saw') { shape([[x, y], [x + 50, y + 4], [x + 50, y + 80], [x, y + 50]], 0.2, 0.3, 1.2); for (let k = 0; k < 8; k++) sline(x + k * 6, y + 50 + k * 4, x + k * 6 + 3, y + 56 + k * 4, 1, 0.6, 0.5); }
  }
}
function darkness(cx, cy) { // night: graded hatch outside the bulb's pool, smudged corners
  for (const [r, ang, gap, a] of [[250, 0.8, 5, 0.32], [340, -0.75, 4.5, 0.36], [440, 0.15, 4, 0.4], [560, 1.4, 3.6, 0.45], [700, -0.3, 3.2, 0.5]]) {
    ctx.save(); ctx.beginPath(); ctx.rect(0, 0, W, H); ctx.ellipse(cx, cy, r * 1.35, r, 0, 0, Math.PI * 2); ctx.clip('evenodd');
    hatchBox(0, 0, W, H, ang, gap, a, 1.1, ink, true); ctx.restore();
  }
  const g = ctx.createRadialGradient(cx, cy, 160, cx, cy, 760);
  g.addColorStop(0, 'rgba(30,26,24,0)'); g.addColorStop(0.35, 'rgba(30,26,24,0.3)'); g.addColorStop(0.7, 'rgba(30,26,24,0.6)'); g.addColorStop(1, 'rgba(24,20,18,0.85)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}
function drawFrontBG() {
  room(false);
  // back wall around the shutter
  shape([[300, 120], [980, 120], [980, 470], [300, 470]], 0.45, 1.1, 1.6, PAPER2);

  // the alley through the opening, below the half-up shutter
  shape([[400, 270], [880, 270], [880, 470], [400, 470]], 0.92, 0.5, 2.4, PAPER2);
  // across the alley: the off licence front (lit window), brick, a bin, a puddle
  shape([[620, 300], [860, 300], [860, 460], [620, 460]], 0.35, 1.0, 1.8);
  shape([[640, 345], [840, 345], [840, 440], [640, 440]], 0.08, 0, 1.4, '#efe9da');
  for (let sx = 650; sx < 835; sx += 16) { // bottles on shelves in the window
    for (const sy of [395, 438]) shape([[sx, sy], [sx + 9, sy], [sx + 9, sy - 26], [sx + 6, sy - 34], [sx + 3, sy - 34], [sx, sy - 26]], 0.35 + (sx % 3) * 0.12, 1.4, 1);
    sline(640, 396, 840, 396, 1.4, 0.7, 1);
  }
  shape([[660, 302], [840, 302], [840, 330], [660, 330]], 0.15, 0, 1.6); // sign board (letters drawn live)
  shape([[410, 360], [470, 360], [478, 460], [402, 460]], 0.7, 1.2, 1.8); // wheelie bin
  shape([[400, 348], [482, 348], [486, 362], [396, 362]], 0.85, 0, 1.6);
  spath(ellipsePts(560, 455, 50, 6, 12), true, 1.2, 0.6, 1.5);
  sline(400, 470, 880, 470, 2.4, 0.9, 1);
  // shutter guide rails
  shape([[390, 160], [402, 160], [402, 470], [390, 470]], 0.6, 0, 1.4);
  shape([[878, 160], [890, 160], [890, 470], [878, 470]], 0.6, 0, 1.4);
  // left wall: tyres and an old poster; right wall: tools, oil drum
  tyreStack(150, 560, 85, 4);
  tyreStack(255, 470, 48, 3);
  shape([[60, 150], [190, 175], [190, 330], [60, 320]], 0.15, 0.4, 1.4);
  text('MOT', 125, 205, 30, ink(0.7)); text('while u wait', 125, 245, 18, ink(0.6));
  sline(80, 280, 170, 285, 1, 0.5, 2); sline(80, 300, 160, 303, 1, 0.5, 2);
  pegboard(1010, 190, 1240, 380);
  shape([[1060, 520], [1180, 520], [1185, 690], [1055, 690]], 0.55, 1.4, 1.8); // oil drum
  spath(ellipsePts(1120, 520, 60, 14, 16), true, 1.6, 0.8, 1.5);
  sline(1057, 580, 1183, 580, 1.4, 0.7, 1); sline(1056, 640, 1184, 640, 1.4, 0.7, 1);
  darkness(640, 380);
}
function drawShutter() { // the half-up shutter: drawn over far robbers so they duck under it
  shape([[402, 160], [878, 160], [878, 272], [402, 272]], 0.3, 0, 1.6, PAPER2);

function carShape() { // a 60s grand tourer, side on: long bonnet, short tail, wire wheels
  const body = [[330, 470], [345, 440], [400, 425], [560, 412], [620, 370], [700, 352], [790, 356], [850, 395], [930, 412], [968, 430], [972, 470], [935, 485], [330, 485]];

}
function drawBackBG() {
  room(true);
  shape([[300, 120], [980, 120], [980, 470], [300, 470]], 0.4, -1.1, 1.6, PAPER2);

      for (let i = 0; i < 10; i++) sline(670 + i * 18, 336, 668 + i * 18 + jit(4), 352, 1, 0.25, 2, red);
    } else text('OFF LICENCE', 750, 316, 26, red(0.35));
    for (const d of state.decals) { ctx.fillStyle = red(0.6); ctx.beginPath(); ctx.ellipse(d.x, d.y, d.r * 1.6, d.r * 0.6, 0, 0, 7); ctx.fill(); }
  } else {
    if (state.doorT > 0) shape([[90, 200], [150, 160], [150, 610], [90, 590]], 0.2, 0, 1.8); // the back door swinging open
    if (state.benchIron) { // the tyre iron on the bench
      shape([[1060, 446], [1170, 432], [1172, 440], [1062, 454]], 0.75, 0, 1.6);
      shape([[1062, 446], [1056, 420], [1064, 418], [1070, 444]], 0.75, 0, 1.4);
    }
    if (state.enemies.some(e => e.st === 'hotwire')) { // sparks under the dash, the one red thing back here
      for (let i = 0; i < 6; i++) { const a = jit(Math.PI); sline(690, 440, 690 + Math.cos(a) * (12 + vr() * 26), 440 + Math.sin(a) * (12 + vr() * 26), 1.6, 0.9, 1, red); }
    }
  }
}
function drawFx() {
  for (const f of state.fx) {
    const k = f.t / f.life, col = f.col === 'red' ? red : ink;
    if (f.kind === 'hit') { burst(f.x, f.y, 60 + k * 50, red, 10, 1 - k); scribble(f.x, f.y, 26, 6, red, 0.8 * (1 - k), 2.4); }
    if (f.kind === 'parry') { burst(f.x, f.y, 90 + k * 120, red, 14, 1 - k); spath(ellipsePts(f.x, f.y, 40 + k * 90, 40 + k * 90, 16), true, 3, 1 - k, 3, red); }
    if (f.kind === 'text') {
      ctx.save(); ctx.globalAlpha = 1 - k * k; const sz = f.col === 'red' ? 40 : 28;
      ctx.font = `${sz}px ${FONT}`; const tw = ctx.measureText(f.txt).width;
      ctx.fillStyle = 'rgba(243,238,225,0.85)'; ctx.fillRect(f.x - tw / 2 - 10, f.y - k * 30 - sz * 0.65, tw + 20, sz * 1.3);
      text(f.txt, f.x, f.y - k * 30, sz, col(1)); ctx.restore();
    }
  }
}
function drawPlay() {
  ctx.setTransform(mainCtx.getTransform());
  const p = state.p;
  jc = 0; boil = Math.floor(vt * 8);
  const pose = armPose();
  // camera: shake, slip, the spin, the turn round
  const sh = state.shake;
  let cx = Math.sin(vt * 91) * sh * 0.6, cy = Math.cos(vt * 77) * sh * 0.5, rot = 0;
  if (p.slipT > 0) { const k = Math.sin((1 - p.slipT / tune.slipTime) * Math.PI); cx -= p.slipDir * 150 * k; rot = p.slipDir * 0.05 * k; }
  let turnK = 0;
  if (p.turnT > 0) { turnK = 1 - p.turnT / tune.turnTime; cx += (turnK < 0.5 ? -turnK * 2 : (1 - turnK) * 2) * 900; }
  cx -= pose.whip * 500;
  const view = p.facing;
  ctx.save();
  ctx.translate(640 + cx, 360 + cy); ctx.rotate(rot); ctx.scale(1.12, 1.12); ctx.translate(-640, -360); // a little bigger than the screen so edges never show
  ctx.drawImage(layer(view), 0, 0, W, H);
  drawWorldDynamic(view);
  const es = state.enemies.filter(e => e.side === view && !(view === 'front' && e.st === 'slip' && e.z < 0.05)).sort((a, b) => b.z - a.z);
  let shutterDone = view !== 'front';
  for (const e of es) {
    if (!shutterDone && e.z < 0.86) { ctx.drawImage(layer('shutter'), 0, 0, W, H); shutterDone = true; }
    drawEnemy(e);
  }
  if (!shutterDone) ctx.drawImage(layer('shutter'), 0, 0, W, H);
  drawFx();
  ctx.restore();
  if (p.turnT > 0 || pose.whip > 0.1) { // speed lines for the turn and the spin
    const a = p.turnT > 0 ? Math.sin(turnK * Math.PI) : pose.whip;
    for (let i = 0; i < 40; i++) { const y = vr() * H; sline(vr() * W * 0.3, y, W - vr() * W * 0.3, y + jit(6), 1.4, 0.5 * a, 3); }
  }
  // you
  if (pose.leg) drawLeg(pose.leg);
  arm(pose.L, -1, 0); arm(pose.R, 1, p.knuckles);
  if (p.hurtFlash > 0) { // red pencil scrawl round the edge when you're hit
    const a = p.hurtFlash / 0.45;
    for (let i = 0; i < 26; i++) { const t = i / 26 * Math.PI * 2; const ex = 640 + Math.cos(t) * 760, ey = 360 + Math.sin(t) * 470; sline(ex, ey, lerp(ex, 640, 0.22 + vr() * 0.1), lerp(ey, 360, 0.22 + vr() * 0.1), 3, 0.8 * a, 4, red); }
  }
  // danger behind you
  const behind = state.enemies.find(e => e.side !== p.facing && e.st === 'windup');
  if (behind && p.turnT <= 0) {
    const a = 0.5 + 0.5 * Math.sin(vt * 20);
    for (let i = 0; i < 12; i++) { sline(0, 120 + i * 45, 60 + vr() * 30, 130 + i * 45, 3, a, 3, red); sline(W, 120 + i * 45, W - 60 - vr() * 30, 130 + i * 45, 3, a, 3, red); }
    patch(640, 640, 340, 46); text('BEHIND YOU!  S', 640, 640, 32, red(1));
  }
  drawHUD();
}
function patch(x, y, w, h) { // a scrap of paper taped on, for HUD text to sit on
  shape([[x - w / 2, y - h / 2 + 2], [x + w / 2, y - h / 2], [x + w / 2 - 3, y + h / 2], [x - w / 2 + 2, y + h / 2 - 2]], 0, 0, 1.4, '#f3eee1');
}
function bar(x, y, w, h, frac, danger) {
  shape([[x, y], [x + w, y], [x + w, y + h], [x, y + h]], 0, 0, 1.6, '#f3eee1');
  if (frac > 0) {
    ctx.save(); polyPath([[x + 3, y + 3], [x + 3 + (w - 6) * frac, y + 3], [x + 3 + (w - 6) * frac, y + h - 3], [x + 3, y + h - 3]]); ctx.clip();
    hatchBox(x, y, x + w, y + h, 0.9, 3, 0.95, 1.6, danger ? red : ink); hatchBox(x, y, x + w, y + h, -0.9, 4, 0.7, 1.2, danger ? red : ink); ctx.restore();
  }
}
function drawHUD() {
  const p = state.p;
  // health
  patch(185, 38, 330, 58);
  text('YOU', 40, 38, 22, ink(0.95), 'left');
  bar(92, 26, 250, 24, p.hp / tune.playerHp, p.hp < tune.playerHp * 0.3);
  // the clock
  patch(640, 40, 210, 62); text(clockNow(), 640, 41, 38, ink(1));
  // the target
  const tg = target() || state.enemies.find(e => e.side === p.facing && e.slot === 0 && alive(e));
  if (tg) { patch(640, 96, 270, 40); text(KINDS[tg.kind].name, 520, 96, 20, ink(0.95), 'left'); bar(660, 86, 110, 18, Math.max(0, tg.hp) / tg.max, true); }
  // the car
  patch(1090, 40, 330, 58);
  drawCarIcon(958, 40);
  text('HOTWIRE', 1000, 40, 20, ink(0.95), 'left');
  bar(1140, 28, 100, 24, state.hotwire / 100, state.hotwire > 0);
  if (state.enemies.some(e => e.st === 'hotwire') && Math.sin(vt * 12) > 0) { patch(1090, 94, 300, 36); text("THEY'RE AT THE MOTOR!", 1090, 94, 22, red(1)); }
  // weapon, combo, facing
  patch(150, 678, 260, 44);
  text(p.weapon === 'iron' ? `TYRE IRON  x${p.ironUses}` : 'FISTS', 40, 678, 22, ink(0.95), 'left');
  text(p.facing === 'front' ? 'facing: shutter' : 'facing: the car', 270, 678, 16, ink(0.75), 'right');
  if (p.combo >= 2) {
    const g = p.combo >= 10 ? 'Masterful' : p.combo >= 6 ? 'Clean' : p.combo >= 3 ? 'Sharp' : 'Scrappy';
    patch(1150, 300, 220, 74); text(`${p.combo} HITS`, 1150, 288, 32, p.combo >= 6 ? red(1) : ink(1)); text(g, 1150, 320, 20, ink(0.85));
  }
  if (p.counterT > 0) { patch(1150, 380, 220, 36); text(`COUNTER x${p.counterMult.toFixed(1).replace('.0', '')}`, 1150, 380, 22, red(1)); }
  if (p.chain.length && !p.move && p.chainT > 0) { text(p.chain.join(' ') + ' ...', 1150, 420, 22, ink(0.8)); }
  // hints and hour cards
  if (state.hint) { ctx.font = `24px ${FONT}`; const w = ctx.measureText(state.hint).width + 40; patch(660, 684, w, 46); text(state.hint, 660, 684, 24, ink(1)); }
  if (state.phase === 'intro' || state.phase === 'breather' || state.phase === 'dawn') {
    const big = state.phase === 'dawn' ? '6:00 AM' : hourLabel(state.wave, 0);
    patch(640, 320, 560, 190);
    text(big, 640, 285, 64, ink(1));
    const sub = state.phase === 'intro' ? 'A stolen motor on the ramp. Keep it there till dawn.'
      : state.phase === 'dawn' ? 'Light under the shutter. They\'ve stopped coming.'
      : `Hour ${state.wave + 1} of ${WAVES.length}.  Health back: +${tune.waveHeal}`;
    text(sub, 640, 355, 22, ink(0.9));
    if (state.phase === 'intro') text('Enter to skip', 640, 392, 16, ink(0.7));
  }
}
function drawCarIcon(x, y) { // a little doodle of the car
  spath([[x - 26, y + 6], [x - 22, y - 2], [x - 6, y - 4], [x, y - 12], [x + 12, y - 12], [x + 18, y - 4], [x + 28, y - 2], [x + 28, y + 6]], true, 1.6, 0.9, 0.8);
  spath(ellipsePts(x - 15, y + 7, 5, 5, 8), true, 1.4, 0.9, 0.5); spath(ellipsePts(x + 17, y + 7, 5, 5, 8), true, 1.4, 0.9, 0.5);
}

// ---- Scenes ----------------------------------------------------------------------------
const scenes = {
  figures: {
    update(dt) { state.t += dt; },
    draw() {
      ctx.setTransform(mainCtx.getTransform()); jc = 0; boil = Math.floor(vt * 8);
      ctx.drawImage(LAYERS.paper, 0, 0, W, H);
      text('Night Shift: who comes in', 640, 50, 32, ink(1));
      const kinds = ['thug', 'brute', 'knife', 'thief', 'gaffer'];
      kinds.forEach((k, i) => {
        const x = 150 + i * 245;
        drawFigure(k, targetJoints(k === 'thief' ? 'loose' : 'idle'), x, 610, 430, {});
        text(KINDS[k].name, x, 655, 24, ink(1));
      });
      text('every figure drawn in pencil: hood, crowbar, cap and knife, beanie and screwdriver, flat cap, coat and bat', 640, 698, 16, ink(0.8));
    },
  },
  title: {
    update() { if (pressed('Enter') || pressed('Space')) { reset(); scene = 'play'; } },
    draw() {
      ctx.setTransform(mainCtx.getTransform()); jc = 0; boil = Math.floor(vt * 8);
      ctx.drawImage(layer('front'), 0, 0, W, H);
      drawWorldDynamic('front');
      ctx.drawImage(layer('shutter'), 0, 0, W, H);
      ctx.fillStyle = 'rgba(235,228,211,0.55)'; ctx.fillRect(0, 0, W, H);
      patch(640, 150, 620, 150);
      text('NIGHT SHIFT', 640, 132, 92, ink(1));
      text('Guard the motor till dawn.', 640, 196, 26, red(1));
      patch(640, 410, 1060, 230);
      CONTROLS.forEach((c, i) => text(c, 640, 330 + i * 50, 22, ink(0.95)));
      const blink = Math.sin(vt * 4) > -0.3;
      patch(640, 610, 380, 56); if (blink) text('ENTER to clock on', 640, 610, 30, ink(1));
    },
  },
  play: {
    update(dt) {
      if (pressed('KeyP') || pressed('Escape')) { scene = 'pause'; return; }
      updatePlay(dt);
    },
    draw() { drawPlay(); },
  },
  pause: {
    update() { if (pressed('KeyP') || pressed('Escape') || pressed('Enter')) scene = 'play'; },
    draw() {
      scenes.play.draw();
      ctx.fillStyle = 'rgba(235,228,211,0.6)'; ctx.fillRect(0, 0, W, H);
      patch(640, 370, 900, 600);
      text('PAUSED: the moves', 640, 110, 40, ink(1));
      MOVE_LIST.forEach(([k, d], i) => { text(k, 300, 165 + i * 44, 24, i >= 3 && i <= 5 ? red(1) : ink(1), 'left'); text(d, 450, 165 + i * 44, 20, ink(0.9), 'left'); });
      text('ESC to carry on', 640, 650, 22, ink(0.85));
    },
  },
  over: {
    update() { if (pressed('KeyR') || pressed('Enter')) { reset(); scene = 'play'; } },
    draw() {
      scenes.play.draw();
      ctx.fillStyle = 'rgba(235,228,211,0.65)'; ctx.fillRect(0, 0, W, H);
      patch(640, 340, 760, 300);
      text(state.lose === 'car' ? 'THE MOTOR\'S GONE' : 'LIGHTS OUT', 640, 240, 60, red(1));
      text(state.gained, 640, 310, 28, ink(1));
      text(`Robbers floored: ${state.floored}    Parries: ${state.parries}    Best combo: ${state.best}`, 640, 360, 22, ink(0.9));
      text('R to start the night again', 640, 430, 26, ink(1));
    },
  },
  results: {
    update() { if (pressed('Enter') || pressed('KeyR')) { reset(); scene = 'play'; } },
    draw() {
      ctx.setTransform(mainCtx.getTransform()); jc = 0; boil = Math.floor(vt * 8);
      ctx.drawImage(LAYERS.paper, 0, 0, W, H);
      // dawn over the alley: a red-pencil sun behind the rooftops
      spath(ellipsePts(640, 470, 150, 150, 24), true, 3, 0.9, 3, red);
      for (let i = 0; i < 18; i++) { const a = Math.PI + i / 17 * Math.PI; sline(640 + Math.cos(a) * 170, 470 + Math.sin(a) * 170, 640 + Math.cos(a) * 240, 470 + Math.sin(a) * 240, 2, 0.7, 3, red); }
      shape([[0, 470], [180, 470], [180, 400], [320, 400], [320, 440], [460, 440], [460, 380], [560, 380], [560, 470], [760, 470], [760, 410], [900, 410], [900, 450], [1080, 450], [1080, 390], [1280, 390], [1280, 720], [0, 720]], 0.7, 0.8, 2);
      patch(640, 220, 760, 240);
      text('6:00 AM. DAWN.', 640, 150, 56, ink(1));
      text(state.gained, 640, 210, 26, ink(1));
      const grade = state.parries >= 12 && state.best >= 10 ? 'Masterful' : state.parries >= 6 ? 'Clean' : state.parries >= 2 ? 'Sharp' : 'Scrappy';
      text(`Robbers floored: ${state.floored}   Parries: ${state.parries}   Best combo: ${state.best}   Night: ${grade}`, 640, 260, 22, ink(0.9));
      text('Enter for another night', 640, 310, 24, ink(1));
    },
  },
};

// ---- Loop: fixed step, frame time clamped ---------------------------------------------
function step() {
  vt += STEP;
  if (pressed('KeyM')) { setMuted(!muted); hit.delete('KeyM'); }
  scenes[scene].update(STEP); hit.clear();
}
let last, acc = 0, ALPHA = 1;
function tick() {
  const now = clock.now();
  acc += Math.min(now - last, 0.25); last = now;
  while (acc >= STEP) { step(); acc -= STEP; }
  ALPHA = acc / STEP;
  drawFrame();
}
function drawFrame() {
  // robbers' poses ease toward where their state wants them
  if (state) for (const e of state.enemies) blendJoints(e, poseFor(e), 1 / 60);
  ctx = mainCtx;
  scenes[scene].draw();
  if (muted) text('muted', W - 50, H - 20, 16, ink(0.7));
}
function frame() { tick(); requestAnimationFrame(frame); }
function timer() { if (document.visibilityState === 'visible' && clock.now() - last > 0.1) tick(); }

// ---- What a check can read and drive (?manual=1 stops the loop; players never see it) ----
window.game = {
  get scene() { return scene; },
  get state() { return state; },
  press(code) { hit.add(code); },
  hold(code, on) { on ? down.add(code) : down.delete(code); },
  get events() { return events; },
  step(n = 1, draw = true, alpha = 1) {
    for (let i = 0; i < n; i++) step();
    if (draw) { ALPHA = alpha; drawFrame(); }
  },
};

buildLayers();
reset();
scene = params.get('scene') || 'title';
last = clock.now();
if (params.get('manual') === '1') drawFrame();
else { requestAnimationFrame(frame); setInterval(timer, 50); }
</script>
